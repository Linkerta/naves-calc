<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17212b">
<title>Калькулятор навеса 3D</title>
<style>
  @font-face{font-family:"Golos Text";font-weight:400 900;font-display:swap;src:url(lib/golos-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:"Golos Text";font-weight:400 900;font-display:swap;src:url(lib/golos-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  :root{
    --paper:#e9edf1; --panel:#fbfcfd; --ink:#17212b; --mute:#5b6876; --rule:#cfd6de; --field:#fff;
    --tape:#f5b800; --tape-soft:#fff3c4; --steel:#3c4a59; --alert:#8a4b00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.45 "Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper);-webkit-text-size-adjust:100%}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  #app{display:grid;grid-template-columns:372px minmax(0,1fr);height:100vh}

  /* ---- панель настроек ---- */
  #side{background:var(--panel);border-right:1.5px solid var(--ink);overflow:auto;padding:18px 18px 40px}
  .head h1{font-size:21px;line-height:1.15;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
  .head p{margin:0 0 14px;color:var(--mute);font-size:13px}
  .presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .chip{border:1px solid var(--rule);background:var(--field);border-radius:4px;padding:5px 9px;font-size:12.5px;cursor:pointer}
  .chip:hover{border-color:var(--ink)}
  details{border-top:1px solid var(--rule);padding:2px 0}
  details:first-of-type{margin-top:12px}
  summary{list-style:none;cursor:pointer;font-weight:700;font-size:14.5px;padding:11px 0 9px;display:flex;justify-content:space-between;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
  details:not([open]) summary::after{transform:rotate(-45deg)}
  details > .body{padding-bottom:10px}
  .row{display:grid;grid-template-columns:minmax(0,1fr) 148px;align-items:center;gap:10px;margin:7px 0}
  .row > label{font-size:13.5px;color:var(--steel)}
  .row.hidden{display:none}
  select,.num{width:100%;height:34px;border:1px solid var(--rule);border-radius:4px;background:var(--field)}
  select{padding:0 8px}
  select:hover,.num:hover{border-color:var(--steel)}
  .num{display:grid;grid-template-columns:32px 1fr 32px;overflow:hidden}
  .num:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .num input{border:0;background:transparent;text-align:center;width:100%;min-width:0;font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield;outline:0}
  .num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .num button{border:0;background:transparent;font-size:18px;line-height:1;cursor:pointer;color:var(--steel);touch-action:manipulation}
  .num button:hover{background:var(--tape-soft);color:var(--ink)}
  .num button:active{background:var(--tape)}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 10px}
  .seg button{border:1px solid var(--rule);background:var(--field);border-radius:4px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px}
  .seg button svg{width:54px;height:26px;stroke:var(--steel);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .seg button:hover{border-color:var(--steel)}
  .seg button[aria-pressed=true]{background:var(--tape);border-color:var(--ink);font-weight:700}
  .seg button[aria-pressed=true] svg{stroke:var(--ink)}
  .chk{display:flex;gap:9px;align-items:flex-start;margin:8px 0;font-size:13.5px;color:var(--steel);cursor:pointer}
  .chk input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--ink);flex:none}
  .colorrow{margin:10px 0 4px}
  .colorrow .cap{display:flex;justify-content:space-between;font-size:13.5px;color:var(--steel);margin-bottom:6px}
  .colorrow .cap b{color:var(--ink);font-weight:600}
  .swatches{display:flex;flex-wrap:wrap;gap:7px}
  .sw{width:30px;height:30px;border-radius:4px;border:1px solid rgba(23,33,43,.25);cursor:pointer;padding:0}
  .sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
  .ghost{border:1px solid var(--rule);background:var(--field);border-radius:4px;padding:7px 12px;cursor:pointer}
  .ghost:hover{border-color:var(--ink)}

  /* ---- 3D и таблица ---- */
  #main{display:flex;flex-direction:column;min-width:0;height:100vh}
  #view{flex:1 1 0;min-height:300px;position:relative;overflow:hidden;background:#dfe8f1}
  #view canvas{display:block;position:absolute;inset:0;outline:0}
  #toolbar{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2}
  .tb{border:1px solid var(--ink);background:var(--panel);border-radius:4px;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
  .tb:hover{background:var(--tape)}
  .tb.group{border-radius:0;margin-left:-7px}
  .tb.first{border-radius:4px 0 0 4px}
  .tb.last{border-radius:0 4px 4px 0;margin-right:6px}
  .tb[aria-pressed=true]{background:var(--ink);color:#fff}
  #hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--steel);background:rgba(251,252,253,.8);padding:3px 8px;border-radius:4px;z-index:2;pointer-events:none}
  /* штамп чертежа */
  #stamp{position:absolute;right:12px;bottom:12px;z-index:2;background:var(--panel);border:1.5px solid var(--ink);display:grid;grid-template-columns:repeat(3,auto);font-variant-numeric:tabular-nums;pointer-events:none}
  #stamp .big{grid-column:1/-1;padding:7px 12px 6px;border-bottom:1.5px solid var(--ink);font-size:17px;font-weight:800;letter-spacing:-.01em;background:var(--tape)}
  #stamp .cell{padding:5px 12px 6px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
  #stamp .cell:nth-child(3n+1){border-right:0}
  #stamp .cell:nth-last-child(-n+3){border-bottom:0}
  #stamp .cell span{display:block;font-size:11px;color:var(--mute);line-height:1.2}
  #stamp .cell b{font-size:14px;font-weight:700}

  #specWrap{height:38%;min-height:170px;overflow:auto;background:var(--panel);border-top:1.5px solid var(--ink)}
  .spechead{display:flex;align-items:center;gap:8px;padding:10px 18px;position:sticky;top:0;left:0;background:var(--panel);z-index:1;border-bottom:1px solid var(--rule)}
  .spechead h2{font-size:15px;font-weight:800;margin:0 auto 0 0}
  #notes{margin:10px 18px 0;padding:8px 12px;background:var(--tape-soft);border-left:4px solid var(--tape);font-size:13px;color:var(--alert)}
  #notes:empty{display:none}
  #notes div+div{margin-top:4px}
  table{border-collapse:collapse;width:calc(100% - 36px);margin:4px 18px 24px;font-size:13px;font-variant-numeric:tabular-nums}
  th,td{padding:6px 10px 6px 0;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
  th{color:var(--mute);font-weight:500;font-size:12px}
  tr.grp th{color:var(--ink);font-weight:700;font-size:13px;padding-top:16px;border-bottom:1.5px solid var(--ink)}
  td.n,th.n{text-align:right;padding-right:0;padding-left:10px}
  tr.tot td{font-weight:800;border-bottom:0;background:linear-gradient(var(--tape-soft),var(--tape-soft))}
  tr.tot td:first-child{padding-left:8px;box-shadow:inset 4px 0 0 var(--tape)}
  tr.tot td:last-child{padding-right:8px}

  /* вкладки, раскрой, чертежи */
  .tabs{display:flex;margin-right:auto}
  .tab{border:1px solid var(--ink);background:var(--panel);padding:6px 12px;font-weight:700;font-size:13.5px;cursor:pointer;margin-left:-1px;white-space:nowrap}
  .tab:first-child{border-radius:4px 0 0 4px;margin-left:0}
  .tab:last-child{border-radius:0 4px 4px 0}
  .tab:hover{background:var(--tape-soft)}
  .tab[aria-selected=true]{background:var(--ink);color:#fff}
  .pane[hidden]{display:none}
  #main.wide #view{min-height:170px}
  #main.wide #specWrap{height:66%}
  .lead{margin:12px 18px 0;color:var(--mute);font-size:13px;max-width:78ch}
  .cutsec{margin:18px 18px 0;padding-top:14px;border-top:1.5px solid var(--ink)}
  .cutsec h3{font-size:15px;font-weight:800;margin:0 0 2px}
  .cutsec .sub{color:var(--mute);font-size:13px;margin:0 0 8px}
  .cutsec table{width:auto;min-width:min(100%,460px);margin:0 0 10px}
  .cutsec td:first-child{font-weight:700;color:var(--alert)}
  .barrow{display:flex;align-items:center;gap:10px;margin:5px 0;font-variant-numeric:tabular-nums}
  .barrow .q{flex:0 0 34px;font-weight:800;text-align:right}
  .barrow .rest{flex:0 0 118px;font-size:12px;color:var(--mute)}
  .bar{flex:1;display:flex;height:26px;min-width:0;border:1.5px solid var(--ink);background:repeating-linear-gradient(45deg,#fff,#fff 4px,#cfd6de 4px,#cfd6de 5.5px)}
  .cut{background:var(--tape-soft);border-right:1.5px solid var(--ink);font-size:11px;line-height:23px;text-align:center;overflow:hidden;white-space:nowrap;min-width:0}
  .cut.j{background:#ffe08a}
  #tabCut,#tabDraw{padding-bottom:28px}
  .sheet{margin:18px 18px 0;border:1.5px solid var(--ink);background:#fff;overflow-x:auto}
  .sheet figcaption{font-weight:800;font-size:15px;padding:8px 12px;border-bottom:1.5px solid var(--ink);background:var(--tape);position:sticky;left:0}
  .sheet svg{display:block;width:100%;height:auto;font-family:inherit}
  .sheet table{width:calc(100% - 24px);margin:0 12px 12px}
  .sheet .note{margin:0 12px 12px;font-size:12.5px;color:var(--mute)}
  .to{fill:none;stroke:#17212b;stroke-linejoin:round}
  .ti{fill:none;stroke:#dfe5ea;stroke-linejoin:round}
  .gr{stroke:#17212b;stroke-width:2.2}
  .ax{stroke:#5b6876;stroke-width:.8;stroke-dasharray:6 4}
  .bs{fill:#dfe5ea;stroke:#17212b;stroke-width:1.2}
  .pl{fill:#17212b}
  .cn{fill:none;stroke:#5b6876;stroke-width:1;stroke-dasharray:5 4}
  .wl{fill:#efe9df;stroke:#17212b;stroke-width:1}
  .rf{fill:none;stroke:#c98a00;stroke-width:3;stroke-linejoin:round}
  .rfb{fill:#f5b800;stroke:#17212b;stroke-width:1}
  .ds{fill:none;stroke:#c98a00;stroke-width:1.5;stroke-dasharray:8 5}
  .lt{stroke:#9aa7b4;stroke-width:1}
  .dm{fill:none;stroke:#17212b;stroke-width:.9}
  .dt{font-size:13px;font-weight:600;fill:#17212b}
  .mk{font-weight:800;fill:#8a4b00}
  .tx{font-size:12px;fill:#5b6876}

  @media (max-width:820px){
    html,body{height:auto;overflow-x:clip}
    #app{display:flex;flex-direction:column;height:auto}
    #main{display:contents}
    #view{order:1;position:sticky;top:0;z-index:5;height:46vh;height:46dvh;min-height:250px;flex:none;border-bottom:1.5px solid var(--ink)}
    #side{order:2;border-right:0;overflow:visible;padding:14px 14px 10px}
    #specWrap{order:3;height:auto;min-height:0;overflow-x:auto}
    .head h1{font-size:18px}
    .row{grid-template-columns:minmax(0,1fr) 156px}
    select,.num{height:40px}
    .num{grid-template-columns:40px 1fr 40px}
    .num input,select{font-size:16px} /* без автозума на iPhone */
    .sw{width:36px;height:36px}
    #toolbar{top:8px;left:8px;right:8px;overflow-x:auto;scrollbar-width:none}
    #toolbar::-webkit-scrollbar{display:none}
    .tb{padding:6px 10px;flex:none}
    #hint,#print{display:none}
    #stamp{left:0;right:0;bottom:0;border-width:1.5px 0 0;grid-template-columns:repeat(6,1fr)}
    #stamp .big{display:none}
    #stamp .cell{padding:3px 6px 4px;border-bottom:0!important;border-right:1px solid var(--rule)!important}
    #stamp .cell span{font-size:10px}
    #stamp .cell b{font-size:12px}
    .spechead{padding:10px 14px}
    #notes{margin:10px 14px 0}
    table{width:calc(100% - 28px);margin:4px 14px 30px;font-size:12.5px}
    td:first-child{white-space:normal;min-width:104px}
    .cutsec td:first-child{min-width:0}
    .spechead{flex-wrap:wrap}
    .tabs{width:100%}
    .tab{flex:1;padding:8px 4px;font-size:13px}
    .lead,.cutsec,.sheet{margin-left:14px;margin-right:14px}
    .sheet svg{min-width:720px}
    .barrow{flex-wrap:wrap;gap:4px 8px}
    .barrow .bar{flex:1 1 70%}
    .barrow .rest{flex:1 1 100%;padding-left:42px}
    td:nth-child(2),tr.grp th{white-space:normal}
    th,td{padding-right:6px}
    td.n,th.n{padding-left:4px}
  }
  @media print{
    #side,#toolbar,#hint,.spechead{display:none!important}
    body[data-tab=cut] #view,body[data-tab=draw] #view{display:none}
    .sheet,.cutsec,.barrow{break-inside:avoid}
    .sheet{overflow:visible}
    #app,#main{display:block;height:auto}
    #view{height:52vh;position:relative}
    #specWrap{height:auto;overflow:visible;border-top:0}
  }
  @media (prefers-reduced-motion:reduce){summary::after{transition:none}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="head">
      <h1>Навес из профильной трубы</h1>
      <p>Задайте размеры и получите 3D-модель со списком материалов.</p>
      <div class="presets" id="presets"></div>
    </div>

    <details open>
      <summary>Размеры</summary>
      <div class="body">
        <div class="row"><label for="width">Ширина, м</label><input type="number" inputmode="decimal" id="width" min="2" max="12" step="0.1"></div>
        <div class="row"><label for="length">Длина, м</label><input type="number" inputmode="decimal" id="length" min="2" max="30" step="0.1"></div>
        <div class="row"><label for="height">Высота до низа фермы, м</label><input type="number" inputmode="decimal" id="height" min="1.8" max="5" step="0.05"></div>
        <div class="row"><label for="rise">Подъём крыши, м</label><input type="number" inputmode="decimal" id="rise" min="0.2" max="3" step="0.05"></div>
      </div>
    </details>

    <details open>
      <summary>Крыша и фермы</summary>
      <div class="body">
        <div class="seg" id="roofTypeSeg" role="group" aria-label="Тип крыши">
          <button type="button" data-val="single"><svg viewBox="0 0 54 26"><path d="M5 20 L49 6 M9 20 V24 M45 8 V24 M9 20 H45"/></svg>Односкатная</button>
          <button type="button" data-val="gable"><svg viewBox="0 0 54 26"><path d="M5 18 L27 5 L49 18 M9 17 V24 M45 17 V24 M9 17 H45"/></svg>Двускатная</button>
          <button type="button" data-val="arch"><svg viewBox="0 0 54 26"><path d="M5 18 Q27 -4 49 18 M9 15 V24 M45 15 V24"/></svg>Арочная</button>
        </div>
        <div class="row" id="rowFarmDepth"><label for="farmDepth">Высота арочной фермы, м</label><input type="number" inputmode="decimal" id="farmDepth" min="0.1" max="0.6" step="0.01"></div>
        <div class="row"><label for="farmStep">Шаг ферм, м</label><input type="number" inputmode="decimal" id="farmStep" min="0.5" max="2" step="0.05"></div>
        <div class="row"><label for="lathStep">Шаг обрешётки, м</label><input type="number" inputmode="decimal" id="lathStep" min="0.3" max="1.2" step="0.05"></div>
        <div class="row"><label for="ovx">Свес по скату, м</label><input type="number" inputmode="decimal" id="ovx" min="0" max="0.8" step="0.05"></div>
        <div class="row"><label for="ovz">Свес по торцам, м</label><input type="number" inputmode="decimal" id="ovz" min="0" max="0.6" step="0.05"></div>
      </div>
    </details>

    <details open>
      <summary>Столбы и установка</summary>
      <div class="body">
        <div class="row"><label for="pillarStep">Шаг столбов, м</label><input type="number" inputmode="decimal" id="pillarStep" min="1" max="4" step="0.1"></div>
        <div class="row"><label for="install">Установка</label>
          <select id="install">
            <option value="base">На бетонную плиту</option>
            <option value="concrete">Бетонирование в грунт</option>
          </select></div>
        <div class="row" id="rowDepth"><label for="concreteDepth">Глубина бетонирования, м</label><input type="number" inputmode="decimal" id="concreteDepth" min="0.5" max="1.8" step="0.05"></div>
        <label class="chk" id="rowWall"><input type="checkbox" id="wall"> Пристенный навес: высокая сторона крепится к стене дома</label>
      </div>
    </details>

    <details open>
      <summary>Кровля и цвет</summary>
      <div class="body">
        <div class="row"><label for="roofMat">Материал</label>
          <select id="roofMat">
            <option value="pc10">Сотовый поликарбонат 10 мм</option>
            <option value="pc8">Сотовый поликарбонат 8 мм</option>
            <option value="mono">Монолитный поликарбонат 4 мм</option>
            <option value="prof">Профнастил С-20</option>
            <option value="tile">Металлочерепица</option>
          </select></div>
        <div class="colorrow"><div class="cap">Цвет кровли <b id="roofColorName"></b></div><div class="swatches" id="roofColors"></div></div>
        <div class="colorrow"><div class="cap">Цвет каркаса <b id="frameColorName"></b></div><div class="swatches" id="frameColors"></div></div>
      </div>
    </details>

    <details>
      <summary>Трубы: сечения и длина хлыста</summary>
      <div class="body">
        <div class="row"><label for="pillarSec">Столбы</label><select id="pillarSec" class="pipe"></select></div>
        <div class="row"><label for="beamSec">Продольные балки</label><select id="beamSec" class="pipe"></select></div>
        <div class="row"><label for="chordSec">Пояса ферм</label><select id="chordSec" class="pipe"></select></div>
        <div class="row"><label for="webSec">Раскосы ферм</label><select id="webSec" class="pipe"></select></div>
        <div class="row"><label for="lathSec">Обрешётка</label><select id="lathSec" class="pipe"></select></div>
        <div class="row"><label for="stock">Длина хлыста в продаже</label><select id="stock"><option value="6">6 м</option><option value="12">12 м</option></select></div>
      </div>
    </details>

    <details>
      <summary>Что показывать</summary>
      <div class="body">
        <label class="chk"><input type="checkbox" id="showRoof" checked> Кровля</label>
        <label class="chk"><input type="checkbox" id="showDims" checked> Размеры</label>
        <label class="chk"><input type="checkbox" id="showCar" checked> Автомобиль</label>
        <label class="chk"><input type="checkbox" id="showPerson" checked> Человек для масштаба</label>
      </div>
    </details>
    <p style="margin:16px 0 0"><button class="ghost" id="reset" type="button">Сбросить настройки</button></p>
  </aside>

  <section id="main">
    <div id="view">
      <div id="toolbar">
        <button class="tb group first" data-view="iso" type="button">3D</button>
        <button class="tb group" data-view="front" type="button">Спереди</button>
        <button class="tb group" data-view="side" type="button">Сбоку</button>
        <button class="tb group last" data-view="top" type="button">Сверху</button>
        <button class="tb" id="shot" type="button">Сохранить картинку</button>
      </div>
      <div id="hint">Вращение: левая кнопка мыши. Масштаб: колесо. Сдвиг: правая кнопка.</div>
      <div id="stamp"></div>
    </div>
    <div id="specWrap">
      <div class="spechead">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="mat" type="button" aria-selected="true">Материалы</button>
          <button class="tab" role="tab" data-tab="cut" type="button" aria-selected="false">Раскрой труб</button>
          <button class="tab" role="tab" data-tab="draw" type="button" aria-selected="false">Чертежи</button>
        </div>
        <button class="ghost" id="copyLink" type="button">Скопировать ссылку</button>
        <button class="ghost" id="csv" type="button">Скачать таблицу</button>
        <button class="ghost" id="print" type="button">Печать</button>
      </div>
      <div class="pane" id="tabMat"><div id="notes"></div><table id="spec"></table></div>
      <div class="pane" id="tabCut" hidden></div>

<script>
(function(){
'use strict';
// ---------- справочники ----------
const PIPES = ['40x20x1.5','40x40x2','60x40x2','60x60x2','80x40x2','80x80x3','100x100x3','120x120x4'];

  farmStep:1.0, lathStep:0.6, ovx:0.2, ovz:0.15, pillarStep:2.5, install:'base', concreteDepth:1.0, wall:false,
  pillarSec:'80x80x3', beamSec:'80x40x2', chordSec:'40x40x2', webSec:'40x20x1.5', lathSec:'40x20x1.5',

const PRESETS = [
  ['Одна машина 3,5 × 6', {width:3.5,length:6}],
  ['Две машины 6 × 6', {width:6,length:6,chordSec:'60x40x2'}],

const PC_COLORS = {'Прозрачный':['#cfe6ff',.45],'Бронза':['#8c6b3f',.6],'Янтарь':['#e8a33c',.6],'Синий':['#3a7bd5',.55],
  'Зелёный':['#3fa34d',.55],'Бирюза':['#2bb3b1',.55],'Красный':['#c0392b',.6],'Молочный':['#f2f1ea',.85]};
const MONO_COLORS = {'Прозрачный':['#e6f3ff',.3],'Бронза':['#8c6b3f',.5],'Серый':['#8a8f96',.5]};

  'Зелёный RAL 6005':'#114232','Вишня RAL 3005':'#5e2129','Синий RAL 5005':'#1e3f7a','Серый грунт':'#8a8d8f'};
const ROOF_INFO = {
  pc10:{name:'Сотовый поликарбонат 10 мм', colors:PC_COLORS, sheetW:2.1, sheetL:[6,12], kgm2:1.1},
  pc8:{name:'Сотовый поликарбонат 8 мм', colors:PC_COLORS, sheetW:2.1, sheetL:[6,12], kgm2:0.9},

const ROOF_TYPES = ['single','gable','arch'];
const STEEL = 7850;
function sec(s){const [a,b,t]=s.split('x').map(Number);return {a:a/1000,b:b/1000,t:t/1000,
  kgm:(a*b-(a-2*t)*(b-2*t))*1e-6*STEEL, perim:2*(a+b)/1000};}
const secName = s => s.replace(/x/g,' × ').replace('.',',');

const $ = id => document.getElementById(id);
const NUMS = ['width','length','height','rise','farmDepth','farmStep','lathStep','ovx','ovz','pillarStep','concreteDepth'];
const SELS = ['install','pillarSec','beamSec','chordSec','webSec','lathSec','roofMat','stock'];
document.querySelectorAll('select.pipe').forEach(s=>{

const KERF=3; // пропил, мм

// ---------- состояние ----------
let P = load();
function load(){
  const p = Object.assign({}, DEFAULTS);
  try{ Object.assign(p, JSON.parse(localStorage.getItem('navesCalc')||'{}')); }catch(e){}
  try{
    const h = decodeURIComponent(location.hash.slice(1));
    if(h.startsWith('{')) Object.assign(p, JSON.parse(h));       // старый формат ссылок
    else if(h) new URLSearchParams(h).forEach((v,k)=>{ if(k in DEFAULTS) p[k] = typeof DEFAULTS[k]==='number' ? parseFloat(v) : typeof DEFAULTS[k]==='boolean' ? v==='1' : v; });
  }catch(e){}
  return sanitize(p);
}
// любые значения из ссылки или памяти приводим к допустимым
function sanitize(p){
  NUMS.forEach(f=>{ const el=$(f); let v=parseFloat(p[f]); if(!isFinite(v)) v=DEFAULTS[f]; p[f]=Math.min(+el.max,Math.max(+el.min,v)); });
  SELS.forEach(f=>{ if(![...$(f).options].some(o=>o.value===p[f])) p[f]=DEFAULTS[f]; });
  if(!ROOF_TYPES.includes(p.roofType)) p.roofType=DEFAULTS.roofType;
  p.wall=!!p.wall;
  if(!(p.roofColor in ROOF_INFO[p.roofMat].colors)) p.roofColor=Object.keys(ROOF_INFO[p.roofMat].colors)[0];
  if(!(p.frameColor in RAL)) p.frameColor=DEFAULTS.frameColor;
  Object.keys(p).forEach(k=>{ if(!(k in DEFAULTS)) delete p[k]; });
  return p;
}
function save(){
  try{ localStorage.setItem('navesCalc', JSON.stringify(P)); }catch(e){}
  const q=new URLSearchParams();
  Object.keys(DEFAULTS).forEach(k=>{ if(P[k]!==DEFAULTS[k]) q.set(k, typeof P[k]==='boolean' ? (P[k]?'1':'0') : P[k]); });
  const s=q.toString();
  try{ history.replaceState(null,'', s ? '#'+s : location.pathname+location.search); }catch(e){}
}

// ---------- UI ----------
// поля чисел с кнопками − и +
NUMS.forEach(f=>{
  const inp=$(f), w=document.createElement('div'); w.className='num';
  inp.parentNode.insertBefore(w,inp);
  const mk=(t,d)=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=t; b.tabIndex=-1;
    b.setAttribute('aria-label',(d>0?'Увеличить: ':'Уменьшить: ')+inp.labels[0].textContent);
    b.addEventListener('click',()=>{
      const st=+inp.step; let v=Math.round((P[f]+d*st)/st)*st;

  };
  w.append(mk('−',-1), inp, mk('+',1));
  inp.addEventListener('input',()=>{ const v=parseFloat(String(inp.value).replace(',','.')); if(isFinite(v)) setNum(f,v); });
  inp.addEventListener('change',()=>{ inp.value=P[f]; });
});
function setNum(f,v){
  const el=$(f); v=Math.min(+el.max,Math.max(+el.min,v)); v=+v.toFixed(3);
  if(v===P[f]) return; P[f]=v; changed();
}
SELS.forEach(f=>$(f).addEventListener('change',()=>{ P[f]=$(f).value; changed(true); }));
document.querySelectorAll('#roofTypeSeg button').forEach(b=>b.addEventListener('click',()=>{ P.roofType=b.dataset.val; changed(true); }));
$('wall').addEventListener('change',()=>{P.wall=$('wall').checked;changed();});
['showRoof','showDims','showCar','showPerson'].forEach(id=>$(id).addEventListener('change',()=>schedule()));
$('reset').addEventListener('click',()=>{ P=sanitize(Object.assign({},DEFAULTS)); changed(true); refit=true; });
PRESETS.forEach(([name,vals])=>{
  const b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=name;
  b.addEventListener('click',()=>{ P=sanitize(Object.assign({},DEFAULTS,{frameColor:P.frameColor},vals)); changed(true); refit=true; });
  $('presets').appendChild(b);
});

function syncUI(){
  NUMS.forEach(f=>{ if(document.activeElement!==$(f)) $(f).value=P[f]; });
  SELS.forEach(f=>{ $(f).value=P[f]; });
  $('wall').checked=P.wall;
  document.querySelectorAll('#roofTypeSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.val===P.roofType));
  $('rowFarmDepth').classList.toggle('hidden', P.roofType!=='arch');

function buildSwatches(){

  fillSw($('roofColors'), info.colors, P.roofColor, k=>{P.roofColor=k;changed();});
  fillSw($('frameColors'), RAL, P.frameColor, k=>{P.frameColor=k;changed();});

}
function fillSw(el,map,cur,cb){
  el.textContent='';
  Object.keys(map).forEach(k=>{
    const b=document.createElement('button'); b.type='button'; b.className='sw'; b.title=k; b.setAttribute('aria-label',k);

let pending=false;
function schedule(){ if(!pending){pending=true;requestAnimationFrame(()=>{pending=false;rebuild();});} }
function changed(resync){

}

// ---------- three.js сцена ----------
const view=$('view');
const isTouch=matchMedia('(pointer:coarse)').matches;
const renderer=new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouch?1.5:2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
view.insertBefore(renderer.domElement, view.firstChild);
const scene=new THREE.Scene();
const HORIZON='#e6edf3';
(function sky(){
  const c=document.createElement('canvas'); c.width=4; c.height=256;
  const g=c.getContext('2d'), gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#9fc3e6'); gr.addColorStop(.55,'#d3e3f1'); gr.addColorStop(1,HORIZON);
  g.fillStyle=gr; g.fillRect(0,0,4,256);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; scene.background=t;
})();
scene.fog=new THREE.Fog(HORIZON, 45, 130);
const camera=new THREE.PerspectiveCamera(38, 1, 0.1, 500);

let controls;
function makeControls(){
  const t=controls ? controls.target.clone() : null;
  if(controls) controls.dispose();
  controls=new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping=true;
  controls.maxPolarAngle=Math.PI*0.495;
  controls.minDistance=2; controls.maxDistance=110;
  if(t){ controls.target.copy(t); controls.update(); }
}
makeControls();
// Защита от «залипших» касаний: если телефон потерял отпускание пальца,
// OrbitControls считает следующее касание вторым пальцем и перестаёт вращать модель.
const activeTouches=new Set();
view.addEventListener('pointerdown', e=>{
  if(e.pointerType!=='mouse' && e.isPrimary && activeTouches.size>0){ activeTouches.clear(); makeControls(); }
  activeTouches.add(e.pointerId);
}, true);
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>window.addEventListener(ev, e=>activeTouches.delete(e.pointerId), true));
function dropTouches(){ if(activeTouches.size){ activeTouches.clear(); makeControls(); } }
window.addEventListener('blur', dropTouches);
window.addEventListener('pagehide', dropTouches);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) dropTouches(); });
// Потеря WebGL-контекста (нехватка памяти на телефоне): восстановиться и перерисовать
renderer.domElement.addEventListener('webglcontextlost', e=>e.preventDefault());
renderer.domElement.addEventListener('webglcontextrestored', ()=>{ matCache={}; schedule(); });

scene.add(new THREE.HemisphereLight('#ffffff','#7f8f70',0.5));
const sun=new THREE.DirectionalLight('#fff4e0',0.75);
sun.castShadow=true;
sun.shadow.mapSize.set(isTouch?1024:2048, isTouch?1024:2048);
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
scene.add(sun); scene.add(sun.target);
const ground=new THREE.Mesh(new THREE.CircleGeometry(160,48), new THREE.MeshStandardMaterial({color:'#7f9a68',roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

let model=new THREE.Group(); scene.add(model);
const unitBox=new THREE.BoxGeometry(1,1,1); unitBox.userData.shared=true;

function resize(){
  const w=view.clientWidth, h=view.clientHeight;
  if(!w||!h) return;
  renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); sizeLabels();
}
window.addEventListener('resize', resize);

// ---------- построение ----------
const X=new THREE.Vector3(1,0,0);
let parts, members, matCache={};
function mat(color, opts){
  const k=color+JSON.stringify(opts||{});
  if(!matCache[k]) matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color, roughness:.55, metalness:.25}, opts||{}));
  return matCache[k];
}
// деталь для ведомости: одинаковые марки и длины складываются
function part(role, mark, name, s, len, qty){
  const mm=Math.round(len*1000), k=mark+'|'+s+'|'+mm, e=parts.find(p=>p.k===k);
  if(e) e.qty+=qty; else parts.push({k, role, mark, name, s, mm, qty});
}
// стержень из профтрубы между точками (только для 3D); сторона a — «вверх», b — поперёк
function member(p1, p2, s){
  const S=sec(s);
  if(p1.distanceTo(p2)<1e-4) return;
  members.push([p1,p2,S.a,S.b]);
}
function flushMembers(color){
  if(!members.length) return;
  const inst=new THREE.InstancedMesh(unitBox, mat(color), members.length);
  const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), d=new THREE.Vector3(), pos=new THREE.Vector3(), sc=new THREE.Vector3();
  members.forEach(([p1,p2,a,b],i)=>{
    d.subVectors(p2,p1); const len=d.length();
    q.setFromUnitVectors(X, d.normalize());
    pos.addVectors(p1,p2).multiplyScalar(.5); sc.set(len,a,b);
    inst.setMatrixAt(i, m4.compose(pos,q,sc));
  });
  inst.castShadow=true; inst.receiveShadow=true; inst.frustumCulled=false;
  model.add(inst);
}
function box(w,h,d,x,y,z,material,shadow){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  m.position.set(x,y,z); m.receiveShadow=true; m.castShadow=!!shadow; model.add(m); return m;
}
const v3=(x,y,z)=>new THREE.Vector3(x,y,z);
const linspace=(a,b,n)=>Array.from({length:n},(_,i)=>n===1?a:a+(b-a)*i/(n-1));

function trussProfile(){
  const W=P.width, ch=sec(P.chordSec), yb=P.height+ch.a/2;
  const S = P.roofType==='arch' ? Math.min(P.rise, W*0.45) : P.rise;
  const h0=Math.min(0.15,S*0.5);
  let N=Math.max(4,Math.round(W/0.6)); if(N%2) N++;
  const xs=linspace(0,W,N+1);
  let top, bot, angle=null, radius=null;
  if(P.roofType==='single'){
    top=x=>yb+h0+(S-h0)*x/W; bot=()=>yb; angle=Math.atan((S-h0)/W);
  }else if(P.roofType==='gable'){
    top=x=>yb+h0+(S-h0)*(1-Math.abs(2*x/W-1)); bot=()=>yb; angle=Math.atan((S-h0)/(W/2));
  }else{
    const R=(W*W/4+S*S)/(2*S), cy=S-R; radius=R;
    const f=x=>cy+Math.sqrt(Math.max(0,R*R-(x-W/2)**2));
    top=x=>yb+P.farmDepth+f(x); bot=x=>yb+f(x);
  }
  const fine = P.roofType==='arch' ? linspace(0,W,Math.max(24,N*2)+1) : (P.roofType==='gable'?[0,W/2,W]:[0,W]);
  return {xs, N, top, bot, fine, yb, angle, radius, clamped:S<P.rise};
}
// детали одной фермы с марками: В — верхний пояс, Н — нижний, С — стойки, Р — раскосы
function trussParts(T){
  const W=P.width, ch=sec(P.chordSec), list=[];
  const polyLen=(f,xa,xb)=>{ const xs=T.fine.filter(x=>x>=xa-1e-9&&x<=xb+1e-9); let s=0; for(let i=0;i<xs.length-1;i++) s+=Math.hypot(xs[i+1]-xs[i], f(xs[i+1])-f(xs[i])); return s; };
  const chord=(kind,name,f,xa,xb)=>list.push({kind,name,s:P.chordSec,len:polyLen(f,xa,xb),xa,xb});
  if(P.roofType==='gable'){ chord('В','Верхний пояс',T.top,0,W/2); chord('В','Верхний пояс',T.top,W/2,W); }
  else chord('В','Верхний пояс',T.top,0,W);
  chord('Н','Нижний пояс',T.bot,0,W);
  const half=T.N/2;
  for(let i=0;i<=T.N;i++){
    const x=T.xs[i], h=T.top(x)-T.bot(x);
    if(h>ch.a*1.2) list.push({kind:'С',name:'Стойка',s:P.webSec,len:h-ch.a,a:[x,T.bot(x)+ch.a/2],b:[x,T.top(x)-ch.a/2]});
    if(i<T.N){
      const x2=T.xs[i+1], forward = P.roofType==='single' ? true : i<half;
      const a = forward ? [x,T.bot(x)] : [x,T.top(x)], b = forward ? [x2,T.top(x2)] : [x2,T.bot(x2)];
      const dist=Math.hypot(b[0]-a[0],b[1]-a[1]), dy=Math.abs(b[1]-a[1]);
      // длина между поясами: по оси минус половины поясов с обеих сторон
      const len = dy>ch.a*1.5 ? dist*(dy-ch.a)/dy : Math.max(0.05, dist-ch.a);
      list.push({kind:'Р',name:'Раскос',s:P.webSec,len,a,b});
    }
  }
  const idx={}, seen={};
  list.forEach(p=>{ p.mm=Math.round(p.len*1000); const k=p.kind+p.mm; if(!seen[k]){ idx[p.kind]=(idx[p.kind]||0)+1; seen[k]=p.kind+idx[p.kind]; } p.mark=seen[k]; });
  return list;
}
// раскрой: укладываем детали в хлысты (сначала длинные), учитывая пропил
function nest(pieces, stock){
  const items=[]; let joints=0;
  pieces.forEach(p=>{
    if(p.len>stock){ let rest=p.len; while(rest>stock){ items.push({len:stock,mark:p.mark,j:true}); rest-=stock; joints++; } if(rest>0) items.push({len:rest,mark:p.mark,j:true}); }
    else items.push(p);
  });
  items.sort((a,b)=>b.len-a.len);
  const bars=[];
  items.forEach(it=>{
    let b=bars.find(b=>b.free>=it.len);
    if(!b){ b={free:stock,cuts:[]}; bars.push(b); }
    b.cuts.push(it); b.free-=it.len+KERF;
  });
  bars.forEach(b=>{ b.rest=Math.max(0, stock-b.cuts.reduce((s,c)=>s+c.len,0)-KERF*(b.cuts.length-1)); });
  return {bars, joints};
}

let refit=true, lastR=null;
function rebuild(){
  scene.remove(model);
  // освобождаем память видеокарты: геометрию и все материалы/текстуры, кроме общих
  const cached=new Set(Object.values(matCache));
  model.traverse(o=>{
    if(o.geometry && !o.geometry.userData.shared) o.geometry.dispose();
    if(o.material && !cached.has(o.material)){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); }
    if(o.isInstancedMesh) o.dispose();
  });
  model=new THREE.Group(); scene.add(model);
  parts=[]; members=[]; labels=[];
  const W=P.width, L=P.length, H=P.height;
  const frameC=RAL[P.frameColor];
  const bm=sec(P.beamSec), ch=sec(P.chordSec), lt=sec(P.lathSec);
  const wall = P.wall && P.roofType==='single';

  // столбы
  const nP=Math.max(2, Math.ceil(L/P.pillarStep-1e-9)+1);
  const zs=linspace(0,L,nP);
  const sides = wall ? [0] : [0,W];
  const pillarTop=H-bm.a;
  const below = P.install==='concrete' ? P.concreteDepth : 0;
  const concreteM=mat('#c9c7c1',{metalness:0,roughness:.95});
  sides.forEach(x=>zs.forEach(z=>{
    member(v3(x,0,z), v3(x,pillarTop,z), P.pillarSec);
    if(P.install==='base') box(.2,.012,.2, x,.086,z, mat('#4a4d52'));
    else{
      const c=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.04,20), concreteM);
      c.position.set(x,.02,z); c.receiveShadow=true; model.add(c);
    }
  }));
  if(P.install==='base'){
    box(W+(wall?0.4:0.8), .08, L+.8, wall?(W-0.4)/2:W/2, .04, L/2, concreteM);
  }else{
    box(W+(wall?0.4:0.8), .02, L+.8, wall?(W-0.4)/2:W/2, .01, L/2, mat('#b9b2a2',{metalness:0,roughness:1}));
  }
  const floorY = P.install==='base' ? .08 : .02;
  part('Столбы','Ст','Столб',P.pillarSec,pillarTop+below,nP*sides.length);
  // продольные балки
  [0,W].forEach(x=>member(v3(x,H-bm.a/2,0), v3(x,H-bm.a/2,L), P.beamSec));
  part('Продольные балки','Б','Балка',P.beamSec,L,wall?1:2);
  if(wall) part('Пристенная балка','Бп','Пристенная балка',P.beamSec,L,1);
  if(wall){
    const wh=H+P.rise+1.3;
    box(.4, wh, L+3, W+bm.b/2+.2, wh/2, L/2, mat('#ddd2c2',{metalness:0,roughness:.9}), true);
  }

  // фермы
  const T=trussProfile();
  const nF=Math.max(2, Math.ceil(L/P.farmStep-1e-9)+1);
  const TP=trussParts(T), fz=linspace(0,L,nF);
  fz.forEach(z=>{
    for(let i=0;i<T.fine.length-1;i++){
      const a=T.fine[i], b=T.fine[i+1];

      member(v3(a,T.bot(a),z), v3(b,T.bot(b),z), P.chordSec);
    }
    TP.forEach(p=>{ if(p.a) member(v3(p.a[0],p.a[1],z), v3(p.b[0],p.b[1],z), p.s); });
  });
  TP.forEach(p=>part(p.kind==='В'?'Верхний пояс ферм':p.kind==='Н'?'Нижний пояс ферм':'Раскосы и стойки', p.mark, p.name, p.s, p.len, nF));

  // профиль кровли (со свесом по скату), смещённый по нормали
  const base=T.fine.map(x=>[x,T.top(x)]);
  const ext=(pA,pB,len)=>{const dx=pA[0]-pB[0],dy=pA[1]-pB[1],l=Math.hypot(dx,dy);return [pA[0]+dx/l*len,pA[1]+dy/l*len];};
  const prof=[...base];
  if(P.ovx>0.001){ prof.unshift(ext(base[0],base[1],P.ovx)); if(!wall) prof.push(ext(base[base.length-1],base[base.length-2],P.ovx)); }
  const offsetProfile=(pts,off)=>pts.map((p,i)=>{
    const a=pts[Math.max(0,i-1)], b=pts[Math.min(pts.length-1,i+1)];
    let tx=b[0]-a[0], ty=b[1]-a[1]; const l=Math.hypot(tx,ty); tx/=l; ty/=l;

  lathPts.forEach(([x,y,i])=>{
    const a=base[i], b=base[i+1]; let tx=b[0]-a[0], ty=b[1]-a[1]; const l=Math.hypot(tx,ty); tx/=l; ty/=l;
    const off=ch.a/2+lt.a/2, px=x-ty*off, py=y+tx*off;

  });
  part('Обрешётка','О','Прогон обрешётки',P.lathSec,L+2*P.ovz,lathPts.length);
  flushMembers(frameC);

  // кровля
  const rp=offsetProfile(prof, ch.a/2+lt.a+0.006);
  let dev=0; for(let i=0;i<rp.length-1;i++) dev+=Math.hypot(rp[i+1][0]-rp[i][0],rp[i+1][1]-rp[i][1]);
  const info=ROOF_INFO[P.roofMat], cval=info.colors[P.roofColor];

  const z0=-P.ovz, z1=L+P.ovz;
  if($('showRoof').checked){
    const pos=[], idx=[];
    rp.forEach(([x,y])=>{pos.push(x,y,z0, x,y,z1);});
    for(let i=0;i<rp.length-1;i++){const k=i*2; idx.push(k,k+1,k+2, k+1,k+3,k+2);}

    const seg=[], jointStep=info.opaque?0.2:info.sheetW;
    const zl=[]; for(let z=z0; z<z1-1e-6; z+=jointStep) zl.push(z); zl.push(z1);
    zl.forEach(z=>{ for(let i=0;i<rp.length-1;i++) seg.push(rp[i][0],rp[i][1]+.004,z, rp[i+1][0],rp[i+1][1]+.004,z); });
    [0,rp.length-1].forEach(i=>seg.push(rp[i][0],rp[i][1]+.004,z0, rp[i][0],rp[i][1]+.004,z1));
    const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.Float32BufferAttribute(seg,3));

    for(let i=0;i<n;i++) car((i+.5)*W/n, floorY, L/2, colors[i%colors.length]);
  }
  // человек для масштаба (≈1,75 м)
  if($('showPerson').checked){
    const pg=new THREE.Group();
    const add=(geo,m,y)=>{const o=new THREE.Mesh(geo,m); o.position.y=y; o.castShadow=true; pg.add(o);};
    add(new THREE.CylinderGeometry(.13,.11,.86,14), mat('#2c3440',{metalness:0,roughness:.9}), .43);
    add(new THREE.CylinderGeometry(.18,.15,.6,14), mat('#f5b800',{metalness:0,roughness:.8}), 1.16);

  if($('showDims').checked){
    const lh=Math.min(.6,Math.max(.3,r*0.05));
    dim(v3(0,.1,L+.9), v3(W,.1,L+.9), fmt(W)+' м', v3(0,0,1), lh);
    dim(v3(-.9,.1,0), v3(-.9,.1,L), fmt(L)+' м', v3(-1,0,0), lh);
    dim(v3(-.6,0,L+.6), v3(-.6,H,L+.6), fmt(H)+' м', v3(-1,0,0), lh);
    const xr=W+.7+(wall?.5:0);
    dim(v3(xr,0,L+.6), v3(xr,ridge,L+.6), fmt(ridge)+' м', v3(1,0,0), lh);
  }

  // свет и тени под размер модели
  const c=v3(W/2,ridge/2,L/2), sr=Math.hypot(W,L,ridge)/2+3;
  sun.position.set(c.x-sr*.7, sr*1.7, c.z+sr*1.1); sun.target.position.copy(c);
  Object.assign(sun.shadow.camera,{left:-sr,right:sr,top:sr,bottom:-sr,near:.5,far:sr*5}); sun.shadow.camera.updateProjectionMatrix();

  // камера следует за размерами
  if(refit || lastR===null){ fitView('iso'); refit=false; }
  else{
    const off=camera.position.clone().sub(controls.target).multiplyScalar(r/lastR);
    controls.target.copy(c); camera.position.copy(c).add(off); controls.update();
  }
  lastR=r;

  G={W,L,H,nP:nP*sides.length,nF,dev,ridge,info,z0,z1,lathCount:lathPts.length,T,TP,rp,zs,fz,sides,pillarTop,below,wall,
     lathX:lathPts.map(p=>p[0]), topMax:Math.max(...T.fine.map(T.top))+ch.a/2};
  report(G);
  renderTab();
}

function car(x,y,z,color){
  const g=new THREE.Group();
  const paint=mat(color,{metalness:.5,roughness:.35}), glass=mat('#26313d',{metalness:.3,roughness:.2}), tyre=mat('#1c1d1f',{metalness:0,roughness:.9});
  const add=(geo,m,px,py,pz)=>{const o=new THREE.Mesh(geo,m); o.position.set(px,py,pz); o.castShadow=true; g.add(o); return o;};
  add(new THREE.BoxGeometry(1.8,.6,4.3), paint, 0,.55,0);
  add(new THREE.BoxGeometry(1.62,.5,2.2), glass, 0,1.1,-.25);
  add(new THREE.BoxGeometry(1.66,.06,2.1), paint, 0,1.37,-.25);

    const w=add(new THREE.CylinderGeometry(.31,.31,.24,20), tyre, wx,.31,wz); w.rotation.z=Math.PI/2;

let labels=[];
function sizeLabels(){
  // высота подписи ≈ 24 px при любом масштабе и размере окна
  const vh=view.clientHeight||600, h=(isTouch?22:24)/vh*2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  labels.forEach(s=>s.scale.set(h*s.userData.aspect,h,1));
}
function label(text){
  const c=document.createElement('canvas'), ctx=c.getContext('2d'), fs=52, font=`700 ${fs}px "Golos Text",-apple-system,"Segoe UI",Arial,sans-serif`;
  ctx.font=font;
  c.width=Math.ceil(ctx.measureText(text).width+36); c.height=fs+26;
  ctx.font=font;
  ctx.fillStyle='#17212b'; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#f5b800'; ctx.fillRect(4,4,c.width-8,c.height-8);
  ctx.fillStyle='#17212b'; ctx.textBaseline='middle'; ctx.fillText(text,18,c.height/2+3);
  const tex=new THREE.CanvasTexture(c); tex.encoding=THREE.sRGBEncoding;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,fog:false,sizeAttenuation:false}));
  s.userData.aspect=c.width/c.height; s.renderOrder=10; labels.push(s); sizeLabels();
  return s;
}
function dim(a,b,text,outward,lh){
  const m=new THREE.LineBasicMaterial({color:'#17212b',depthTest:false,fog:false});
  const dir=new THREE.Vector3().subVectors(b,a).normalize();
  let tick=new THREE.Vector3().crossVectors(dir,outward); if(tick.lengthSq()<1e-6) tick=outward.clone();
  tick.normalize().multiplyScalar(.14);
  const pts=[a,b]; [a,b].forEach(p=>pts.push(p.clone().add(tick),p.clone().sub(tick)));
  const l=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),m); l.renderOrder=9; model.add(l);
  const s=label(text); s.position.copy(a).add(b).multiplyScalar(.5).add(outward.clone().multiplyScalar(.3)); model.add(s);
}

function report(d){
  const mo=['Ст','Б','Бп','В','Н','С','Р','О'], mk=m=>m.replace(/\d+$/,'');
  parts.sort((a,b)=>mo.indexOf(mk(a.mark))-mo.indexOf(mk(b.mark))||(parseInt(a.mark.replace(/\D/g,''))||0)-(parseInt(b.mark.replace(/\D/g,''))||0));

  parts.forEach(p=>{ const k=p.role+'|'+p.s, a=agg[k]=agg[k]||{role:p.role,s:p.s,len:0,n:0}; a.len+=p.mm/1000*p.qty; a.n+=p.qty; });
  const rows=Object.values(agg);
  const order=['Столбы','Продольные балки','Пристенная балка','Верхний пояс ферм','Нижний пояс ферм','Раскосы и стойки','Обрешётка'];
  const counted=['Столбы','Продольные балки','Пристенная балка','Обрешётка'];
  rows.sort((a,b)=>order.indexOf(a.role)-order.indexOf(b.role));
  csvRows=[['Позиция','Сечение / описание','Кол-во','Длина, м','Масса, кг']];
  let html='';
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const group=(t)=>{ html+=`<tr class="grp"><th colspan="5">${t}</th></tr>`; csvRows.push([t]); };
  const line=(a,b,c,dd,e,cls)=>{
    html+=`<tr${cls?` class="${cls}"`:''}><td>${esc(a)}</td><td>${esc(b||'')}</td><td class="n">${esc(c||'')}</td><td class="n">${esc(dd||'')}</td><td class="n">${esc(e||'')}</td></tr>`;
    csvRows.push([a,b||'',c||'',dd||'',e||'']);
  };
  html+='<tr><th>Позиция</th><th>Сечение, мм</th><th class="n">Кол-во</th><th class="n">Длина, м</th><th class="n">Масса, кг</th></tr>';
  group('Каркас');
  let mass=0, paint=0; const bySec={};
  rows.forEach(r=>{
    const S=sec(r.s), kg=r.len*S.kgm; mass+=kg; paint+=r.len*S.perim;
    bySec[r.s]=(bySec[r.s]||0)+r.len;
    line(r.role, secName(r.s), counted.includes(r.role)?r.n+' шт':'', f1(r.len), kg.toFixed(0));
  });
  line('Всего металла','', '', f1(rows.reduce((s,r)=>s+r.len,0)), mass.toFixed(0), 'tot');
  const stock=+P.stock*1000;
  nests={};
  Object.keys(bySec).sort((a,b)=>PIPES.indexOf(a)-PIPES.indexOf(b)).forEach(s=>{
    const pieces=[]; parts.filter(p=>p.s===s).forEach(p=>{ for(let i=0;i<p.qty;i++) pieces.push({len:p.mm,mark:p.mark}); });
    nests[s]=nest(pieces, stock);
  });
  group(`Сколько трубы купить: хлысты по ${P.stock} м, по схеме раскроя`);
  Object.keys(nests).forEach(s=>{
    const n=nests[s].bars.length, len=n*stock/1000;
    line('Профильная труба', secName(s), n+' шт', f1(len), (len*sec(s).kgm).toFixed(0));

    info.sheetL.forEach(SL=>{
      const n = d.dev<=SL ? Math.ceil(cols/Math.floor(SL/d.dev+1e-9)) : cols*Math.ceil(d.dev/SL-1e-9);

    if(P.roofType==='gable') line('Конёк, планки по 2 м','', Math.ceil(roofLen/1.9)+' шт', f1(roofLen));

  $('spec').innerHTML=html;
  csvRows.push(['Ведомость деталей']); csvRows.push(['Марка','Деталь','Сечение, мм','Длина, мм','Кол-во']);

  const T=d.T;

  const cell=(k,v)=>`<div class="cell"><span>${k}</span><b>${v}</b></div>`;

  if(T.angle!==null && THREE.MathUtils.radToDeg(T.angle)<6) notes.push('Уклон меньше 6°: вода и снег будут сходить плохо. Увеличьте подъём крыши.');

  if(P.pillarStep>3 && sec(P.pillarSec).a<0.08) notes.push('При шаге столбов больше 3 м берите столб не меньше 80 × 80.');
  const longP=parts.filter(p=>p.mm>stock);
  if(longP.length){
    const near=longP.find(p=>p.mm<=stock*1.12);
    notes.push(`Длиннее хлыста ${P.stock} м: ${longP.map(p=>p.name.toLowerCase()+' '+nfmt(p.mm)+' мм').join(', ')}. Такие детали свариваются из кусков.`+
      (near&&near.mark==='О' ? ' Уменьшите свес по торцам, и обрешётка получится из целого хлыста.' : P.stock==='6' ? ' С хлыстами 12 м стыков будет меньше.' : ''));

}

    pat.forEach(({n,b})=>{
      h+=`<div class="barrow"><span class="q">× ${n}</span><div class="bar">`+
        b.cuts.map(c=>`<div class="cut${c.j?' j':''}" style="flex:0 0 ${(c.len/stock*100).toFixed(2)}%" title="${c.mark}: ${c.len} мм">${c.mark} ${nfmt(c.len)}</div>`).join('')+
        `</div><span class="rest">${b.rest>=1?'остаток '+nfmt(Math.round(b.rest))+' мм':'без остатка'}</span></div>`;
    });
    if(N.joints) h+=`<p class="sub" style="margin-top:8px">Детали длиннее хлыста (выделены цветом) свариваются встык из нескольких кусков. Стыков: ${N.joints}. Стыки располагайте над столбами или фермами.</p>`;
    h+=`</section>`;
  });
  if(roofCut){
    const info=G.info, c=roofCut;
    h+=`<section class="cutsec"><h3>Кровля: ${info.name.toLowerCase()}</h3><p class="sub">Купить: ${c.sheetsTxt}.</p>`+
       `<table><tr><th>Полоса</th><th class="n">Ширина, мм</th><th class="n">Длина, мм</th><th class="n">Кол-во</th></tr>`+
       (c.cols>1?`<tr><td>Целая</td><td class="n">${nfmt(MM(info.sheetW))}</td><td class="n">${nfmt(MM(G.dev))}</td><td class="n">${c.cols-1} шт</td></tr>`:'')+
       `<tr><td>${c.cols>1?'Крайняя':'Одна'}</td><td class="n">${nfmt(MM(Math.min(info.sheetW,c.lastW)))}</td><td class="n">${nfmt(MM(G.dev))}</td><td class="n">1 шт</td></tr></table>`+
       `<p class="sub">Длина полосы идёт по скату, ширина вдоль навеса.${info.opaque?' Для профнастила добавьте нахлёст листов на одну волну.':''}</p></section>`;
  }
  $('tabCut').innerHTML=h;
}

// ---------- чертежи (SVG) ----------
function Sheet(title, x0,y0,x1,y1, maxH){
  const VW=1000, pl=96, pr=96, pt=52, pb=92;
  const sc=Math.min((VW-pl-pr)/(x1-x0), maxH/(y1-y0));
  const VH=Math.round((y1-y0)*sc+pt+pb), ox=pl+((VW-pl-pr)-(x1-x0)*sc)/2;
  const X=x=>+(ox+(x-x0)*sc).toFixed(1), Y=y=>+(pt+(y1-y)*sc).toFixed(1), o=[];
  return {sc, X, Y,
    tube(pts,thick){ const d=pts.map((p,i)=>(i?'L':'M')+X(p[0])+' '+Y(p[1])).join(''), w=Math.max(3,thick*sc);
      o.push(`<path d="${d}" class="to" stroke-width="${(w+1.4).toFixed(1)}"/><path d="${d}" class="ti" stroke-width="${Math.max(1,w-1.2).toFixed(1)}"/>`); },
    line(xa,ya,xb,yb,cls){ o.push(`<line x1="${X(xa)}" y1="${Y(ya)}" x2="${X(xb)}" y2="${Y(yb)}" class="${cls}"/>`); },
    rect(xa,ya,xb,yb,cls){ const w=Math.max(2,Math.abs(X(xb)-X(xa))), hh=Math.max(2,Math.abs(Y(yb)-Y(ya)));
      o.push(`<rect x="${((X(xa)+X(xb))/2-w/2).toFixed(1)}" y="${((Y(ya)+Y(yb))/2-hh/2).toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" class="${cls}"/>`); },
    poly(pts,cls){ o.push(`<polyline points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" class="${cls}"/>`); },
    text(x,y,str,q){ q=q||{}; const px=X(x)+(q.dx||0), py=Y(y)+(q.dy||0);
      o.push(`<text x="${px.toFixed(1)}" y="${py.toFixed(1)}" text-anchor="${q.anchor||'middle'}" class="${q.cls||'tx'}"${q.fs?` font-size="${q.fs.toFixed(1)}"`:''}>${str}</text>`); },
    // off в пикселях листа: плюс — ниже/правее точки, минус — выше/левее
    dimH(xa,xb,yFrom,off,label){ const ya=Y(yFrom), yl=ya+off, a=X(xa), b=X(xb), e=off>0?5:-5;
      o.push(`<path d="M${a} ${ya}V${yl+e}M${b} ${ya}V${yl+e}M${a-5} ${yl}H${b+5}M${a-4} ${yl+4}L${a+4} ${yl-4}M${b-4} ${yl+4}L${b+4} ${yl-4}" class="dm"/>`);
      o.push(`<text x="${((a+b)/2).toFixed(1)}" y="${yl-5}" text-anchor="middle" class="dt">${label}</text>`); },
    dimV(ya,yb,xFrom,off,label){ const xa=X(xFrom), xl=xa+off, a=Y(ya), b=Y(yb), e=off>0?5:-5, ty=((a+b)/2).toFixed(1);
      o.push(`<path d="M${xa} ${a}H${xl+e}M${xa} ${b}H${xl+e}M${xl} ${a+5}V${b-5}M${xl-4} ${a+4}L${xl+4} ${a-4}M${xl-4} ${b+4}L${xl+4} ${b-4}" class="dm"/>`);
      o.push(`<text x="${xl-5}" y="${ty}" text-anchor="middle" class="dt" transform="rotate(-90 ${xl-5} ${ty})">${label}</text>`); },
    html(extra){ return `<figure class="sheet"><figcaption>${title}</figcaption><svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${title}">${o.join('')}</svg>${extra||''}</figure>`; }
  };
}
// цепочка размеров; если звеньев слишком много — одна надпись «n × шаг»
function chain(S, pts, yFrom, off, vertical){
  const n=pts.length-1; if(n<1) return;
  const step=MM(pts[1]-pts[0]), even=pts.every((p,i)=>!i||Math.abs(MM(p-pts[i-1])-step)<=1);
  const px=Math.abs(S.X(pts[1])-S.X(pts[0]));
  if(n>1 && even && px<46){ S.dimH(pts[0],pts[n],yFrom,off,`${n} × ${nfmt(step)} = ${nfmt(MM(pts[n]-pts[0]))}`); return true; }
  for(let i=0;i<n;i++) S.dimH(pts[i],pts[i+1],yFrom,off,nfmt(MM(pts[i+1]-pts[i])));
  return false;
}
function drawTrussOn(S, dy){
  const T=G.T, ch=sec(P.chordSec), wb=sec(P.webSec);
  G.TP.forEach(p=>{ if(p.a) S.tube([[p.a[0],p.a[1]-dy],[p.b[0],p.b[1]-dy]], wb.a); });
  S.tube(T.fine.map(x=>[x,T.bot(x)-dy]), ch.a);
  S.tube(T.fine.map(x=>[x,T.top(x)-dy]), ch.a);
}
function renderDraw(){
  const T=G.T, W=G.W, L=G.L, H=G.H, yb=T.yb;
  const pil=sec(P.pillarSec), bm=sec(P.beamSec), ch=sec(P.chordSec);
  let h=`<p class="lead">Чертежи строятся по текущим настройкам. Размеры в миллиметрах, по осям труб. Перед резкой сверьте их с ведомостью на вкладке «Раскрой труб».</p>`;

  // 1. ферма
  { const top=x=>T.top(x)-yb, bot=x=>T.bot(x)-yb, ymax=Math.max(...T.fine.map(top));
    const S=Sheet(`Ферма Ф1, ${G.nF} шт`, 0,0,W,ymax, 280);
    drawTrussOn(S, yb);
    const fs=Math.max(8.5,Math.min(13,W/T.N*S.sc*0.26));
    G.TP.forEach(p=>{
      if(p.a){ const mx=(p.a[0]+p.b[0])/2, my=(p.a[1]+p.b[1])/2-yb;
        if(p.kind==='С') S.text(mx,my,p.mark,{dx:-5,dy:fs*.35,fs,cls:'mk',anchor:'end'});
        else S.text(mx,my,p.mark,{dx:6,dy:-3,fs,cls:'mk',anchor:'start'}); }
      else{ const mx=p.xa+(p.xb-p.xa)*(p.kind==='В'?0.3:0.5);
        if(p.kind==='В') S.text(mx,top(mx),p.mark,{dy:-12,cls:'mk',fs:13});
        else S.text(mx,bot(mx),p.mark,{dy:20,cls:'mk',fs:13}); }
    });
    chain(S, T.xs, 0, 36);
    S.dimH(0,W,0,66,nfmt(MM(W)));
    if(top(0)-bot(0)>0.02) S.dimV(bot(0),top(0),0,-30,nfmt(MM(top(0)-bot(0))));
    const xpk = P.roofType==='single' ? W : W/2;
    if(xpk<W) S.line(xpk,ymax,W,ymax,'ax');
    S.dimV(0,ymax,W,40,nfmt(MM(ymax)));
    const rowsT=[]; const seen=new Set();
    const ko='ВНСР';
    [...G.TP].sort((p,q)=>ko.indexOf(p.kind)-ko.indexOf(q.kind)||parseInt(p.mark.slice(1))-parseInt(q.mark.slice(1))).forEach(p=>{ if(seen.has(p.mark)) return; seen.add(p.mark); const q=G.TP.filter(x=>x.mark===p.mark).length;
      rowsT.push(`<tr><td><b>${p.mark}</b></td><td>${p.name}</td><td>${secName(p.s)}</td><td class="n">${nfmt(p.mm)}</td><td class="n">${q}</td><td class="n">${q*G.nF}</td></tr>`); });
    h+=S.html(`<table><tr><th>Марка</th><th>Деталь</th><th>Сечение, мм</th><th class="n">Длина, мм</th><th class="n">На ферму</th><th class="n">Всего</th></tr>${rowsT.join('')}</table>`+
      `<p class="note">${P.roofType==='arch'?`Пояса гнутся по дуге, радиус по оси верхнего пояса около ${nfmt(MM(T.radius+P.farmDepth))} мм. `:''}Длины стоек и раскосов даны между поясами. Торцы раскосов подрезаются под угол по месту.</p>`);
  }
  // 2. поперечный разрез
  { const rx=G.rp.map(p=>p[0]), x0=Math.min(...rx,-pil.a), x1=Math.max(...rx,W+pil.a)+(G.wall?0.45:0), y0=-G.below, y1=G.ridge;
    const S=Sheet('Поперечный разрез', x0,y0,x1,y1, 400);
    S.line(x0-0.25,0,x1+0.25,0,'gr');
    if(G.wall) S.rect(W+bm.b/2,0,W+bm.b/2+0.4,y1,'wl');
    G.sides.forEach(x=>{ if(G.below) S.rect(x-0.15,-G.below,x+0.15,0,'cn'); S.tube([[x,-G.below],[x,G.pillarTop]],pil.a); });
    [0,W].forEach(x=>S.rect(x-bm.b/2,H-bm.a,x+bm.b/2,H,'bs'));
    drawTrussOn(S, 0);
    S.poly(G.rp,'rf');
    S.dimH(0,W,y0,40,nfmt(MM(W)));
    S.dimH(Math.min(...rx),Math.max(...rx),y1,-24,nfmt(MM(Math.max(...rx)-Math.min(...rx))));
    S.dimV(0,H,x0,-34,nfmt(MM(H)));
    if(G.below) S.dimV(-G.below,0,x0,-34,nfmt(MM(G.below)));
    S.dimV(0,G.ridge,x1,36,nfmt(MM(G.ridge)));
    h+=S.html(`<p class="note">Жёлтая линия: кровля. ${G.below?'Пунктир: бетон в скважине Ø 300 мм. ':'Столбы стоят на плите, крепление через опорные пластины. '}Высота ${nfmt(MM(H))} мм дана до низа фермы.</p>`);
  }
  // 3. вид сбоку
  { const S=Sheet('Вид сбоку', G.z0,-G.below,G.z1,G.ridge, 320);
    S.line(G.z0-0.25,0,G.z1+0.25,0,'gr');
    G.zs.forEach(z=>{ if(G.below) S.rect(z-0.15,-G.below,z+0.15,0,'cn'); S.tube([[z,-G.below],[z,G.pillarTop]],pil.b); });
    S.rect(0,H-bm.a,L,H,'bs');
    G.fz.forEach(z=>S.rect(z-ch.b/2,H,z+ch.b/2,G.topMax,'bs'));
    S.rect(G.z0,G.topMax,G.z1,G.ridge,'rfb');
    chain(S, G.zs, -G.below, 36);
    S.dimH(0,L,-G.below,66,nfmt(MM(L)));
    const folded=chain(S, G.fz, G.ridge, -24);
    S.dimV(0,H,G.z0,-34,nfmt(MM(H)));
    h+=S.html(`<p class="note">Снизу: шаг столбов. Сверху: шаг ферм${folded?' (количество × шаг)':''}. Столбов в ряду: ${G.zs.length}.</p>`);
  }
  // 4. план
  { const rx=G.rp.map(p=>p[0]), xa=Math.min(...rx,-pil.a), xb=Math.max(...rx,W+pil.a);
    const S=Sheet('План каркаса', G.z0,xa,G.z1,xb, 380);
    S.rect(G.z0,Math.min(...rx),G.z1,Math.max(...rx),'ds');
    G.lathX.forEach(x=>S.line(G.z0,x,G.z1,x,'lt'));
    G.fz.forEach(z=>S.rect(z-ch.b/2,0,z+ch.b/2,W,'bs'));
    [0,W].forEach(x=>S.rect(0,x-bm.b/2,L,x+bm.b/2,'bs'));
    G.sides.forEach(x=>G.zs.forEach(z=>S.rect(z-pil.b/2-0.02,x-pil.a/2-0.02,z+pil.b/2+0.02,x+pil.a/2+0.02,'pl')));
    chain(S, G.zs, xa, 36);
    S.dimH(0,L,xa,66,nfmt(MM(L)));
    S.dimV(0,W,G.z0,-34,nfmt(MM(W)));
    S.dimH(G.z0,G.z1,xb,-24,nfmt(MM(G.z1-G.z0)));
    h+=S.html(`<p class="note">Чёрные квадраты: столбы. Поперёк идут фермы, вдоль тонкими линиями обрешётка (${G.lathCount} шт). Пунктир: край кровли.${G.wall?' Верхняя сторона примыкает к стене.':''}</p>`);
  }
  $('tabDraw').innerHTML=h;
}

// ---------- камера ----------
function fitView(kind){
  const W=P.width, L=P.length, Hh=P.height+P.rise;
  const c=v3(W/2,Hh/2,L/2), r=Math.max(W,L,Hh)*1.05+2;
  const dirs={iso:v3(-0.9,0.55,1.15),front:v3(0,0.1,1),side:v3(-1,0.1,0),top:v3(0.001,1,0.001)};
  const d=dirs[kind].normalize();
  let dist=r/Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*0.64;
  if(camera.aspect<1.3) dist*=1.25/Math.max(0.6,camera.aspect); // узкий экран телефона
  camera.position.copy(c).add(d.multiplyScalar(dist));
  controls.target.copy(c); controls.update();
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>fitView(b.dataset.view)));
function download(href,name){ const a=document.createElement('a'); a.href=href; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
$('shot').addEventListener('click',()=>{
  renderer.render(scene,camera);
  download(renderer.domElement.toDataURL('image/png'), `naves_${P.width}x${P.length}.png`);
});
$('csv').addEventListener('click',()=>{
  const txt=csvRows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const url=URL.createObjectURL(new Blob(['﻿'+txt],{type:'text/csv;charset=utf-8'}));
  download(url, `naves_${P.width}x${P.length}.csv`); setTimeout(()=>URL.revokeObjectURL(url),2000);
});
$('print').addEventListener('click',()=>window.print());
$('copyLink').addEventListener('click',async()=>{
  const b=$('copyLink'); let ok=false;
  try{ await navigator.clipboard.writeText(location.href); ok=true; }
  catch(e){
    const t=document.createElement('textarea'); t.value=location.href; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select(); try{ ok=document.execCommand('copy'); }catch(_){} t.remove();
  }
  b.textContent = ok ? 'Ссылка скопирована' : 'Скопируйте адрес из строки браузера';
  setTimeout(()=>{ b.textContent='Скопировать ссылку'; }, 2200);
});
if(isTouch) $('hint').style.display='none';

function loop(){
  requestAnimationFrame(loop); // следующий кадр планируем первым: ошибка кадра не остановит анимацию
  try{ controls.update(); renderer.render(scene,camera); }catch(e){ console.error(e); }
}
window.__calc={get P(){return P;}, set(p){ P=sanitize(Object.assign({},DEFAULTS,p)); syncUI(); rebuild(); }, info:()=>renderer.info, setTab, get parts(){return parts;}, get nests(){return nests;}};
syncUI(); resize(); rebuild(); save(); loop();
new ResizeObserver(resize).observe(view);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>schedule()); // подписи размеров — уже нужным шрифтом
})();
